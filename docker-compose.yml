name: order-system

services:
  gateway:
    image: caddy:2.11.4-alpine
    profiles: ['app']
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:8080'
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/docker/Caddyfile:/etc/caddy/Caddyfile:ro

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    profiles: ['app']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-orders}:${POSTGRES_PASSWORD:-orders_dev}@postgres:5432/${POSTGRES_DB:-orders}
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    init: true
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    profiles: ['app']
    command: ['node', 'packages/database/scripts/migrate.js', 'development']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orders}:${POSTGRES_PASSWORD:-orders_dev}@postgres:5432/${POSTGRES_DB:-orders}
    read_only: true
    restart: 'no'
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders_dev}
      POSTGRES_USER: ${POSTGRES_USER:-orders}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
